<title>ServiceDZ</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0E5A4A;--y:#FFC93C;--ink:#1B2733;--bg:#F3F7F6;--card:#fff;--mut:#5F6F7A;--line:#DCE5E2;--red:#D64545;--ok:#1E8E5A}
@media (prefers-color-scheme:dark){:root{--bg:#10191A;--card:#172426;--ink:#EAF1EF;--mut:#9DB0AB;--line:#284043}}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:86px;line-height:1.6}
header{background:linear-gradient(160deg,#0E5A4A,#0A3D33);color:#fff;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 22px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:26px;font-weight:800}header h1 span{background:var(--y);color:var(--ink);padding:0 8px;border-radius:8px;font-size:19px;margin-inline-start:6px}
header p{margin:2px 0 0;opacity:.9;font-size:14px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
select,input,textarea{width:100%;font:inherit;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:8px}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.tile{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:10px 2px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile span{font-size:28px;line-height:1.2}.tile[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.top{display:flex;gap:12px}.av{flex:none;width:52px;height:52px;border-radius:14px;background:#FFF0C2;display:grid;place-items:center;font-size:28px}
h2{font-size:18px;margin:18px 0 4px}.card h3{margin:0;font-size:16px}.meta{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:1px 9px;border-radius:99px;margin-inline-start:6px}
.v{background:#DDF3E8;color:#0B6B40}.nv{background:#EEE;color:#666}.pend{background:#FFF0C2;color:#7A5A00}.bad{background:#FADADA;color:#A02020}
.btn{font:inherit;font-weight:800;padding:10px 14px;border-radius:10px;border:0;cursor:pointer;background:var(--g);color:#fff}
.btn.y{background:var(--y);color:var(--ink)}.btn.gr{background:var(--line);color:var(--ink)}.btn.r{background:var(--red)}
.acts,.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.row .btn{flex:1}
.empty{text-align:center;color:var(--mut);padding:26px 0}.note{font-size:13px;color:var(--mut)}
.sum{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.demo{background:#FFF7DA;color:#6B5200;border-radius:12px;padding:8px 12px;font-size:13px;margin:12px 0}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;font:inherit;font-size:13px;padding:8px 2px;color:var(--mut);cursor:pointer}
nav button b{display:block;font-size:22px;font-weight:400}nav button[aria-current=true]{color:var(--g);font-weight:800}
dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,470px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}dialog h2{margin-top:0}dialog label{display:block;margin-top:10px;font-weight:500}
.err{color:var(--red);font-size:14px;min-height:20px}
.veh{display:flex;gap:8px;margin-top:8px}.veh label{margin:0;flex:1}.veh input{display:none}
.veh span{display:flex;flex-direction:column;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:8px 2px;font-size:28px;cursor:pointer}
.veh small{font-size:12px}.veh input:checked+span{border-color:var(--g);background:#DDF3E8;color:#0B3;}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick button{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 6px;font:inherit;font-weight:800;color:var(--ink);cursor:pointer;font-size:15px}
.quick button b{display:block;font-size:34px;font-weight:400}
.steps{display:flex;gap:4px;margin:10px 0;font-size:12px}.steps div{flex:1;text-align:center;padding:4px 0;border-radius:8px;background:var(--line);color:var(--mut)}
.steps .on{background:#DDF3E8;color:#0B6B40;font-weight:800}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const CATS=[["سباكة","🔧"],["كهرباء","⚡"],["نقل وشحن","🚚"],["تنظيف","🧹"],["دهن وبناء","🏗️"],["ميكانيك","🚗"],["دروس","🎓"],["إلكترونيات","📱"],["ملابس","👗"],["كتب","📚"],["سيارات","🚙"],["عقارات","🏠"]];
const BIG=["سيارات","عقارات"],VEH=[["🚗","سيارة"],["🛻","بيك أب"],["🚚","شاحنة"],["🏍️","دراجة"]];
const WIL=["الجزائر","وهران","قسنطينة","سطيف","عنابة","تيزي وزو","بجاية","باتنة","البليدة","تلمسان"];
const GEO={"الجزائر":[36.75,3.06],"وهران":[35.70,-0.63],"قسنطينة":[36.37,6.61],"سطيف":[36.19,5.41],"عنابة":[36.90,7.77],"تيزي وزو":[36.71,4.05],"بجاية":[36.75,5.08],"باتنة":[35.56,6.17],"البليدة":[36.47,2.83],"تلمسان":[34.88,-1.32]};
function dist(a,b){if(!a||!b)return null;const R=6371,dl=(b[0]-a[0])*Math.PI/180,dg=(b[1]-a[1])*Math.PI/180;
const x=Math.sin(dl/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dg/2)**2;
return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)))}
let myPos=null;
const MODE={fixed:"سعر ثابت",quote:"حسب الطلب",after:"الدفع بعد الإنجاز"};
const ic=c=>(CATS.find(x=>x[0]===c)||[0,"📦"])[1];
const SEED=[
["s1","سباك لتصليح التسربات","سباكة","الجزائر","كريم بن علي","0555000001","fixed",2500,"ver",[5,5,4,5]],
["s2","كهربائي منزلي","كهرباء","وهران","ياسين مرابط","0555000002","after",2000,"ver",[5,4,5]],
["s3","نقل أثاث وبضائع","نقل وشحن","سطيف","رشيد حمداني","0555000003","quote",6000,"ver",[4,5],"🚚"],
["s4","نقل بضاعة بسيارة بيك أب","نقل وشحن","الجزائر","سمير قاسمي","0555000004","quote",4000,"none",[],"🛻"],
["s5","قندورة قسنطينية تقليدية","ملابس","قسنطينة","نادية بوعلي","0555000005","fixed",18000,"ver",[5,5]],
["s6","كتب جامعية (طب)","كتب","الجزائر","مكتبة الأمل","0555000006","fixed",1500,"ver",[4,5,5]],
["s7","سيارة Symbol 2018","سيارات","وهران","معرض النور","0555000007","fixed",1650000,"none",[]],
["s8","شقة F3 للبيع","عقارات","عنابة","وكالة الشرق","0555000008","fixed",9500000,"none",[]],
["s9","دروس رياضيات وفيزياء","دروس","الجزائر","أمين بوعزة","0555000009","after",1500,"ver",[5,5,5,4]]
].map(a=>({id:a[0],t:a[1],c:a[2],w:a[3],n:a[4],p:a[5],mode:a[6],price:a[7],st:a[8],r:a[9],v:a[10]}));
let S={orders:[],reqs:[],mine:[]};try{Object.assign(S,JSON.parse(localStorage.getItem("kdz3")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("kdz3",JSON.stringify(S))}catch(e){}};
let tab="home",cat="",wil="",q="";
const D=$("dlg"),openD=h=>{D.innerHTML=h;D.showModal()};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money=n=>Number(n).toLocaleString("ar-DZ")+" دج";
const all=()=>[...S.mine,...SEED],find=id=>all().find(x=>x.id===id);
const opts=(a,s,f)=>(f?`<option value="">${f}</option>`:"")+a.map(x=>`<option ${x===s?"selected":""}>${x}</option>`).join("");
const badge=s=>s==="ver"?'<span class="tag v">موثّق</span>':s==="pend"?'<span class="tag pend">قيد المراجعة</span>':'<span class="tag nv">غير موثّق</span>';
const rate=x=>{const r=[...x.r,...S.orders.filter(o=>o.lid===x.id&&o.rate).map(o=>o.rate)];return r.length?[(r.reduce((a,b)=>a+b,0)/r.length).toFixed(1),r.length]:null};
const plabel=x=>x.mode==="quote"?`ابتداء من ${money(x.price)}`:money(x.price);
const paidNow=o=>o.pay==="full"?o.amt:Math.round(o.amt*o.pct/100);

function home(){
  let l=all().filter(x=>(!cat||x.c===cat)&&(!wil||x.w===wil)&&(!q||(x.t+x.n).includes(q)));
  l=l.map(x=>({x,km:myPos?dist(myPos,GEO[x.w]):null}));
  if(myPos)l.sort((a,b)=>(a.km??1e9)-(b.km??1e9));
  return `<input id="q" placeholder="🔍 ابحث: سباك، قندورة، سيارة..." value="${esc(q)}" aria-label="بحث">
  <div class="row" style="margin-top:8px"><select id="w" aria-label="الولاية" style="flex:1;margin-top:0">${opts(WIL,wil,"كل الولايات")}</select>
  <button class="btn gr" id="loc" style="flex:none">${myPos?"📍 قريب مني":"📍 استخدم موقعي"}</button></div>
  <div class="grid">${CATS.map(([k,i])=>`<button class="tile" aria-pressed="${k===cat}" data-c="${k}"><span>${i}</span>${k}</button>`).join("")}</div>
  ${l.length?l.map(({x,km})=>{const r=rate(x);return `<article class="card"><div class="top"><div class="av">${x.v||ic(x.c)}</div><div style="flex:1;min-width:0">
  <h3>${esc(x.t)}</h3><div class="meta">${esc(x.n)} ${badge(x.st)}</div><div class="meta">${esc(x.w)}${km!=null?` · 📍 ~${km} كم منك`:""} · ${r?`★ ${r[0]} (${r[1]} صفقات مؤكدة)`:"جديد"}</div>
  <div><b>${plabel(x)}</b> <span class="tag nv">${MODE[x.mode]}</span></div></div></div>
  <div class="acts">${x.mode==="quote"?`<button class="btn" data-quote="${x.id}">اطلب عرض سعر</button>`:`<button class="btn" data-buy="${x.id}">${BIG.includes(x.c)?"احجز بعربون":"اطلب بدفع مضمون"}</button>`}</div></article>`}).join(""):'<div class="empty">ما كاين نتائج.</div>'}`;
}
function locate(){
  const b=$("loc");if(!navigator.geolocation){alert("المتصفح ما يدعمش تحديد الموقع.");return}
  b.textContent="... جاري التحديد";
  navigator.geolocation.getCurrentPosition(p=>{myPos=[p.coords.latitude,p.coords.longitude];render()},
    ()=>{alert("ما قدرناش نوصلو لموقعك. تأكد من السماح بالوصول للموقع.");b.textContent="📍 استخدم موقعي"},{enableHighAccuracy:true,timeout:8000});
}
function ask(){
  return `<h2>واش تحتاج؟</h2><p class="note">وصف طلبك، تجيك عروض أسعار، تتفاوض وتختار، وما تدفع حتى تتفق.</p>
  <div class="quick"><button data-ask="سباكة"><b>🔧</b>أحتاج سباك</button><button data-ask="نقل وشحن"><b>🚚</b>نقل بضاعة</button><button data-ask="كهرباء"><b>⚡</b>أحتاج كهربائي</button><button data-ask="ميكانيك"><b>🚗</b>ميكانيكي</button><button data-ask="تنظيف"><b>🧹</b>تنظيف</button><button data-ask="">📦<br>طلب آخر</button></div>`;
}
function sell(){
  return `<h2>اعرض خدمتك أو منتجك</h2><p class="note">خدمة، قندورة، كتب، سيارة، عقار... وأنت تختار طريقة التسعير.</p>
  <input id="mt" placeholder="عنوان العرض (مثلا: قندورة عاصمية)"><select id="mc">${CATS.map(([k,i])=>`<option value="${k}">${i} ${k}</option>`).join("")}</select>
  <select id="mw">${opts(WIL)}</select><select id="mm"><option value="fixed">سعر ثابت</option><option value="quote">حسب الطلب (عرض سعر)</option><option value="after">الدفع بعد الإنجاز</option></select>
  <input id="mp" type="number" inputmode="numeric" placeholder="السعر أو سعر البداية (دج)"><input id="mh" type="tel" inputmode="tel" placeholder="هاتفك 05XXXXXXXX (يبقى مخفي)">
  <label class="note" for="mi" style="display:block;margin-top:8px">صورة بطاقة التعريف للتوثيق (اختياري)</label><input id="mi" type="file" accept="image/*">
  <div class="err" id="me" role="alert"></div><div class="acts"><button class="btn" id="ms">انشر العرض</button></div>`;
}
function mine(){
  let h="";
  if(S.reqs.length){h+="<h2>طلباتي والعروض</h2>"+S.reqs.map(r=>`<article class="card"><h3>${ic(r.c)} ${esc(r.c)} ${r.veh||""}</h3>
  <div class="meta">${r.from?`من ${esc(r.from)} إلى ${esc(r.to)}<br>`:""}${esc(r.d)} · ${esc(r.w)}</div>
  ${r.offers.map(o=>`<div class="sum"><b>${esc(o.n)}</b> ${badge(o.st)} <span class="tag ${o.ok?"v":"nv"}">${o.ok?"وافق على سعرك":"عرض"}</span><br>${money(o.amt)}
  <div class="acts"><button class="btn gr" data-cnt="${r.id}:${o.id}">اقترح سعرا</button><button class="btn" data-acc="${r.id}:${o.id}">اقبل وادفع</button></div></div>`).join("")}</article>`).join("")}
  if(S.orders.length){h+="<h2>صفقاتي</h2>"+S.orders.map(ord).join("")}
  if(S.mine.length){h+="<h2>عروضي</h2>"+S.mine.map(x=>`<article class="card"><h3>${ic(x.c)} ${esc(x.t)} ${badge(x.st)}</h3><div class="meta">${esc(x.w)} · ${plabel(x)} · ${MODE[x.mode]}</div>
  <div class="acts">${x.st==="pend"?`<button class="btn y" data-appr="${x.id}">محاكاة: قبول التوثيق</button>`:""}<button class="btn gr" data-del="${x.id}">حذف</button></div></article>`).join("")}
  return h||'<div class="empty">ما عندك طلبات بعد.<br>ابدأ من "اطلب" أو من الرئيسية.</div>';
}
function ord(o){
  const nm=["اتفاق","دفع محجوز","إنجاز","تحرير"],rest=o.amt-paidNow(o),w=o.big?"المعاينة":"الإنجاز";
  return `<article class="card"><h3>${esc(o.t)} ${o.d?'<span class="tag bad">نزاع قيد المراجعة</span>':""}</h3><div class="meta">${esc(o.n)}</div>
  <div class="steps">${nm.map((n,i)=>`<div class="${i<=o.s?"on":""}">${n}</div>`).join("")}</div>
  <div class="sum">الإجمالي: ${money(o.amt)}<br>المحجوز الآن: ${money(paidNow(o))}${rest?`<br>الباقي عند ${w}: ${money(rest)}`:""}<br>عمولة التطبيق (8%): ${money(Math.round(o.amt*.08))}</div>
  <div class="meta" style="margin-top:8px">هاتف البائع: <a href="tel:${esc(o.p)}">${esc(o.p)}</a></div>
  ${o.d?"":o.s===1?`<div class="acts"><button class="btn y" data-dn="${o.id}">محاكاة: البائع أنجز</button><button class="btn r" data-dis="${o.id}">أبلغ عن مشكل</button></div>`:
  o.s===2?`<div class="acts"><button class="btn" data-rel="${o.id}">تمّ ${w}، حرّر الدفع${rest?" وادفع الباقي":""}</button><button class="btn r" data-dis="${o.id}">أبلغ عن مشكل</button></div><div class="note">إذا سكتّ 48 ساعة تُراجع الصفقة قبل تحرير المال.</div>`:
  o.rate?`<div class="meta">تقييمك: ${"★".repeat(o.rate)}</div>`:`<div class="acts">${[1,2,3,4,5].map(n=>`<button class="btn y" data-rt="${o.id}:${n}" aria-label="${n} نجوم">${n}★</button>`).join("")}</div><div class="note">التقييم بعد إتمام الصفقة فقط.</div>`}</article>`;
}
function render(){$("view").innerHTML={home,ask,sell,mine}[tab]();document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.t===tab))}

function payDlg(o){
  const pct=o.big?5:30;
  openD(`<h2>تأكيد وحجز الدفع</h2><div class="sum"><b>${esc(o.t)}</b><br>${esc(o.n)}<br>المبلغ المتفق عليه: ${money(o.amt)}</div>
  <label for="pm">طريقة الدفع</label><select id="pm">${o.big?`<option value="dep">عربون حجز ${pct}% فقط</option>`.replace("30","5"):`<option value="full" ${o.def==="full"?"selected":""}>كامل المبلغ محجوز حتى التأكيد</option><option value="dep" ${o.def==="dep"?"selected":""}>عربون ${pct}% والباقي عند الإنجاز</option>`}</select>
  <div class="sum">${o.big?"في السيارات والعقارات لا يُدفع الثمن كاملا عبر التطبيق. يُحجز عربون فقط، ويتم البيع والتوقيع عند الموثق أو المصالح المختصة.":"لا يبدأ العمل إلا بعد حجز الدفع، ولا يصل المال للبائع إلا بعد تأكيدك."}</div>
  <div class="row"><button class="btn gr" data-x>إلغاء</button><button class="btn" id="go">ادفع (محاكاة)</button></div>`);
  $("go").onclick=()=>{S.orders.unshift({id:"o"+Date.now(),lid:o.lid,t:o.t,n:o.n,p:o.p,amt:o.amt,pay:$("pm").value,pct,big:o.big,s:1});
    if(o.rid)S.reqs=S.reqs.filter(r=>r.id!==o.rid);save();D.close();tab="mine";render()};
}
function reqDlg(pc,only){
  openD(`<h2>اطلب خدمة</h2><select id="rc" onchange="$('tr').hidden=this.value!=='نقل وشحن'">${CATS.map(([k,i])=>`<option value="${k}" ${k===pc?"selected":""}>${i} ${k}</option>`).join("")}</select>
  <div id="tr" ${pc==="نقل وشحن"?"":"hidden"}><div class="veh">${VEH.map(([i,n],k)=>`<label><input type="radio" name="vh" value="${i}" ${k?"":"checked"}><span>${i}<small>${n}</small></span></label>`).join("")}</div>
  <input id="rf" placeholder="من (مكان التحميل)"><input id="rt" placeholder="إلى (مكان التسليم)"></div>
  <textarea id="rd" rows="3" placeholder="وصف الطلب"></textarea><select id="rw">${opts(WIL)}</select>
  <input id="rb" type="number" inputmode="numeric" placeholder="ميزانيتك (اختياري، دج)"><div class="err" id="re" role="alert"></div>
  <div class="row"><button class="btn gr" data-x>إلغاء</button><button class="btn" id="rg">أرسل الطلب</button></div>`);
  $("rg").onclick=()=>{
    const c=$("rc").value,d=$("rd").value.trim(),tr=c==="نقل وشحن";
    if(!d){$("re").textContent="اكتب وصف الطلب.";return}
    const cand=(only?[find(only)]:SEED.filter(x=>x.c===c)).slice(0,3),b=+$("rb").value||(cand[0]?cand[0].price:3000);
    const src=cand.length?cand:[{n:"حرفي موثّق",st:"ver",p:"0555000010"},{n:"مقدّم خدمة",st:"none",p:"0555000011"}];
    S.reqs.unshift({id:"r"+Date.now(),c,d,w:$("rw").value,veh:tr?document.querySelector("input[name=vh]:checked").value:"",from:tr?$("rf").value:"",to:tr?$("rt").value:"",big:BIG.includes(c),
      offers:src.map((x,k)=>({id:"f"+k,lid:x.id||null,n:x.n,st:x.st,p:x.p,amt:Math.round(b*[.95,1.05,1.15][k]/100)*100}))});
    save();D.close();tab="mine";render();
  };
}
function cntDlg(rid,oid){
  const r=S.reqs.find(x=>x.id===rid),o=r.offers.find(x=>x.id===oid);
  openD(`<h2>اقترح سعرا</h2><div class="sum">سعر ${esc(o.n)}: ${money(o.amt)}</div><input id="cn" type="number" inputmode="numeric" placeholder="سعرك (دج)"><div class="err" id="ce" role="alert"></div>
  <div class="row"><button class="btn gr" data-x>إلغاء</button><button class="btn" id="cs">أرسل</button></div>`);
  $("cs").onclick=()=>{const v=+$("cn").value;if(!(v>0)){$("ce").textContent="أدخل سعرا صحيحا.";return}
    if(v<Math.round(o.amt*.85/100)*100){$("ce").textContent="رفض البائع. أقل سعر يقبله: "+money(Math.round(o.amt*.85/100)*100);return}
    o.amt=v;o.ok=1;save();D.close();render()};
}
const V=$("view");
V.addEventListener("click",e=>{
  const t=e.target,d=t.dataset,ord=k=>S.orders.find(x=>x.id===k);
  if(t.id==="loc")return locate();
  if(d.c!==undefined){cat=cat===d.c?"":d.c;render();return}
  if(d.ask!==undefined)return reqDlg(d.ask);
  if(d.quote)return reqDlg(find(d.quote).c,d.quote);
  if(d.buy){const x=find(d.buy);return payDlg({lid:x.id,t:x.t,n:x.n,p:x.p,amt:x.price,big:BIG.includes(x.c),def:x.mode==="after"?"dep":"full"})}
  if(d.cnt)return cntDlg(...d.cnt.split(":"));
  if(d.acc){const[rid,oid]=d.acc.split(":"),r=S.reqs.find(x=>x.id===rid),o=r.offers.find(x=>x.id===oid);
    return payDlg({rid,lid:o.lid,t:r.c+": "+r.d.slice(0,40),n:o.n,p:o.p,amt:o.amt,big:r.big,def:"full"})}
  if(d.dn)ord(d.dn).s=2;else if(d.rel)ord(d.rel).s=3;else if(d.dis)ord(d.dis).d=1;
  else if(d.rt){const[k,n]=d.rt.split(":");ord(k).rate=+n}
  else if(d.appr)S.mine.find(x=>x.id===d.appr).st="ver";
  else if(d.del)S.mine=S.mine.filter(x=>x.id!==d.del);
  else if(t.id==="ms"){
    const tt=$("mt").value.trim(),p=$("mh").value.replace(/\s/g,""),pr=+$("mp").value;
    if(!tt||!(pr>0)||!/^0[5-7]\d{8}$/.test(p)){$("me").textContent="أكمل العنوان والسعر ورقم هاتف بصيغة 05XXXXXXXX.";return}
    S.mine.unshift({id:"m"+Date.now(),t:tt,c:$("mc").value,w:$("mw").value,n:"أنا",p,mode:$("mm").value,price:pr,st:$("mi").files.length?"pend":"none",r:[]});tab="mine";
  }else return;
  save();render();
});
V.addEventListener("change",e=>{if(e.target.id==="w")wil=e.target.value;else if(e.target.id==="q")q=e.target.value.trim();else return;render()});
D.addEventListener("click",e=>{if(e.target.dataset.x!==undefined)D.close()});
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
render();

</script>
</body>
</html>
